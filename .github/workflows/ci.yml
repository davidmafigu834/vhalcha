name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vhalcha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vhalcha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      VHALCHA_ENV: test
      VHALCHA_PROVIDER_MODE: mock
      VHALCHA_EMBEDDING_MODE: mock
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/vhalcha
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-not-a-placeholder-value-32
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm --filter @vhalcha/database db:migrate
      - name: Confirm migration history
        working-directory: packages/database
        run: pnpm exec tsx src/verify-migrations.ts
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
